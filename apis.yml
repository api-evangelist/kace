name: Kace
description: >-
  KACE is the endpoint and systems management product line from Quest Software, originally
  founded in 2003 as KACE Networks (backed by Norwest Venture Partners, Sigma Partners, and
  Focus Ventures), acquired by Dell in 2010, and now sold as Quest KACE. The portfolio centers
  on the KACE Systems Management Appliance (SMA) for inventory, patching, software distribution,
  scripting, and service desk; the KACE Systems Deployment Appliance (SDA) for OS imaging and
  provisioning; and KACE Cloud for mobile device management and modern endpoint management.
  The KACE SMA ships a REST API (JSON and XML) that lets administrators programmatically manage
  assets, inventory, managed installations, scripting, users, and service-desk tickets on the
  customer-hosted appliance. This profile enriches the original Norwest portfolio lead with the
  real Quest KACE identity and its documented API surface.
