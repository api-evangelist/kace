apis:
- name: KACE Systems Management Appliance (SMA) API
  description: >-
    REST API for the KACE Systems Management Appliance. Authenticated KACE SMA users can manage
    appliance data across the Asset, Inventory, Managed Install, Scripting, User, and Service Desk
    modules. Requests and responses support JSON and XML (selected via Accept / Content-Type), with
    API routing controlled by an x-kace-api-version header and query features for filtering, sorting,
    paging, shaping, and counting. The API runs on the customer-hosted appliance, so the base URL is
    the local appliance host (https://<kace_sma_host>/ams/); there is no shared public production host.
  humanURL: https://support.quest.com/technical-documents/kace-systems-management-appliance/15.0/api-reference-guide
